<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>声波测距 · 测距端</title>
<style>
  :root{ --bg:#0f1420; --panel:#1a2233; --line:#2a3448; --txt:#e6edf7; --dim:#8a97ad; --acc:#3fb6ff; --ok:#3fd68f; --warn:#ffb454; --err:#ff6b6b; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--txt); display:flex; flex-direction:column; }
  header{ padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); display:flex; align-items:center; gap:10px; }
  .dot{ width:9px; height:9px; border-radius:50%; background:#5a6577; flex:none; }
  .dot.on{ background:var(--ok); box-shadow:0 0 6px var(--ok); }
  h1{ font-size:16px; margin:0; flex:1; font-weight:600; }
  #connBtn{ background:var(--acc); color:#04121f; border:none; border-radius:7px; padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer; }
  #connBtn:disabled{ opacity:.5; cursor:default; }
  main{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:20px; }
  #dist{ font-size:64px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-1px; }
  #dist .unit{ font-size:24px; color:var(--dim); font-weight:400; margin-left:6px; }
  #distLine{ font-size:14px; color:var(--dim); min-height:20px; }
  #measureBtn{ background:var(--acc); color:#04121f; border:none; border-radius:14px; padding:18px 44px; font-size:20px; font-weight:700; cursor:pointer; }
  #measureBtn:disabled{ opacity:.5; }
  #calBtn{ background:#2a3448; color:var(--txt); border:none; border-radius:9px; padding:11px 20px; font-size:14px; cursor:pointer; }
  #calBtn:disabled{ opacity:.5; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center; }
  label{ font-size:13px; color:var(--dim); }
  input[type=number]{ width:90px; background:#0c1220; border:1px solid var(--line); color:var(--txt); border-radius:6px; padding:6px 8px; font-size:14px; }
  .hint{ font-size:12px; color:var(--dim); text-align:center; max-width:340px; line-height:1.6; }
  #calState{ font-size:13px; color:var(--warn); }
  #calState.ok{ color:var(--ok); }
</style>
</head>
<body>
<header>
  <span class="dot" id="connDot"></span>
  <h1>📏 声波测距 · 测距端</h1>
  <button id="connBtn">连接</button>
</header>

<main>
  <div id="dist"><span id="distVal">---</span><span class="unit">m</span></div>
  <div id="distLine">未测量</div>
  <button id="measureBtn" disabled>测距</button>
  <div class="row">
    <button id="calBtn" disabled>校准（两机贴合）</button>
    <span id="calState">未校准</span>
  </div>
  <div class="row">
    <button id="selfTestBtn" disabled>自测（本机能否收发该频段）</button>
  </div>
  <div class="row">
    <label>声速 m/s</label>
    <input type="number" id="soundSpeed" value="343" min="300" max="400" step="1">
  </div>
  <div class="hint">另一端请打开 <b>slave.html</b> 并连接，充当应答端。<br>测距时两台手机保持视线无遮挡，扬声器对准麦克风。</div>
</main>

<script>
"use strict";
// ===== 常量 =====
const CHIRP_F0 = 15000, CHIRP_F1 = 18000;  // 近超声 15-18kHz（抗环境噪声）；两端必须一致，可闻版用 4000/10000
const CHIRP_MS = 30;                        // chirp 时长
const N_FFT = 16384;                        // FFT/匹配滤波窗口
const TURNAROUND_MS = 300;                  // 应答端固定转身延迟（本端不直接用）
let SAMPLE_RATE = 48000;

// ===== DSP 核心 =====
function makeChirp(f0, f1, ms, sr){
  const n = Math.round(ms / 1000 * sr);
  const re = new Float32Array(n), im = new Float32Array(n);
  const T = n / sr;
  for (let i = 0; i < n; i++){
    const t = i / sr;
    const phi = 2 * Math.PI * (f0 * t + (f1 - f0) / (2 * T) * t * t);
    const w = 0.5 * (1 - Math.cos(2 * Math.PI * i / (n - 1)));
    re[i] = Math.sin(phi) * w;
    im[i] = Math.cos(phi) * w;
  }
  return { re, im, length: n };
}
function fft(re, im){
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++){
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j){ let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
  }
  for (let len = 2; len <= n; len <<= 1){
    const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len){
      let cr = 1, ci = 0;
      for (let j = 0; j < (len >> 1); j++){
        const a = i + j, b = i + j + (len >> 1);
        const tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
        const nr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = nr;
      }
    }
  }
}
function ifft(re, im){
  const n = re.length;
  for (let i = 0; i < n; i++) im[i] = -im[i];
  fft(re, im);
  for (let i = 0; i < n; i++){ im[i] = -im[i]; re[i] /= n; im[i] /= n; }
}
function makeRefFFT(chirp){
  const re = new Float32Array(N_FFT), im = new Float32Array(N_FFT);
  for (let i = 0; i < chirp.length; i++){ re[i] = chirp.re[i]; im[i] = chirp.im[i]; }
  fft(re, im);
  return { re, im };
}
function matchedFilterEnv(buf, refRe, refIm){
  const n = buf.length;
  const re = new Float32Array(n), im = new Float32Array(n);
  for (let i = 0; i < n; i++) re[i] = buf[i];
  fft(re, im);
  for (let i = 0; i < n; i++){
    const a = re[i], b = im[i];
    re[i] = a * refRe[i] + b * refIm[i];
    im[i] = b * refRe[i] - a * refIm[i];
  }
  ifft(re, im);
  const env = new Float32Array(n);
  for (let i = 0; i < n; i++) env[i] = Math.sqrt(re[i] * re[i] + im[i] * im[i]);
  return env;
}
function findPeak(env, chirpLen){
  const n = env.length;
  let ymax = 0;
  for (let i = 0; i < n - chirpLen; i++) if (env[i] > ymax) ymax = env[i];
  if (ymax <= 0) return null;
  const thr = ymax * 0.4;
  for (let i = 1; i < n - chirpLen - 1; i++){
    if (env[i] > thr && env[i] >= env[i - 1] && env[i] >= env[i + 1]){
      let delta = 0;
      const a = env[i - 1], b = env[i], c = env[i + 1];
      const denom = a - 2 * b + c;
      if (denom !== 0){
        delta = 0.5 * (a - c) / denom;
        if (delta > 0.5) delta = 0.5;
        if (delta < -0.5) delta = -0.5;
      }
      return { pos: i + delta, value: env[i] };
    }
  }
  return null;
}

// ===== 状态 =====
let audioCtx = null, micStream = null, processor = null, connected = false;
let buf = new Float32Array(0), bufStartTime = 0;
let upChirp, downChirp, upRef, downRef, refEnergy = 0;
let state = 'idle';            // idle | awaiting
let t0 = 0, deadline = 0;
let pendingCalib = false;      // 本次测量是否为校准
let calibRTT = null;           // 零距离校准的往返时间（秒）
let results = [];              // 每次点击收集的多次 RTT
const TARGET_COUNT = 3;        // 每次点击测几次，取中位数抗抖动
let deafUntil = 0;             // 失聪窗口：发送上行 chirp 后短暂忽略自己麦克风

function initRefs(){
  upChirp = makeChirp(CHIRP_F0, CHIRP_F1, CHIRP_MS, SAMPLE_RATE);
  downChirp = makeChirp(CHIRP_F1, CHIRP_F0, CHIRP_MS, SAMPLE_RATE);
  upRef = makeRefFFT(upChirp);
  downRef = makeRefFFT(downChirp);
  refEnergy = 0;
  for (let i = 0; i < upChirp.length; i++) refEnergy += upChirp.re[i]*upChirp.re[i] + upChirp.im[i]*upChirp.im[i];
}

// ===== 音频 =====
async function connect(){
  audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
  SAMPLE_RATE = audioCtx.sampleRate;
  initRefs();
  await audioCtx.resume();
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false }
  });
  const src = audioCtx.createMediaStreamSource(micStream);
  processor = audioCtx.createScriptProcessor(4096, 1, 1);
  const mute = audioCtx.createGain(); mute.gain.value = 0;
  src.connect(processor); processor.connect(mute); mute.connect(audioCtx.destination);
  processor.onaudioprocess = onAudio;
  connected = true;
  connDot.classList.add('on');
  connBtn.textContent = '已连接'; connBtn.disabled = true;
  measureBtn.disabled = false;
  calBtn.disabled = false;
  selfTestBtn.disabled = false;
  distLine.textContent = '已连接，先点「自测」验证频段';
}

function onAudio(e){
  const data = e.inputBuffer.getChannelData(0);
  const t = e.playbackTime;
  if (state === 'awaiting' && audioCtx.currentTime < deafUntil) return;   // 失聪窗口
  if (buf.length === 0) bufStartTime = t;
  const tmp = new Float32Array(buf.length + data.length);
  tmp.set(buf); tmp.set(data, buf.length);
  buf = tmp;
  const maxLen = N_FFT * 2;
  if (buf.length > maxLen){ const drop = buf.length - maxLen; buf = buf.slice(drop); bufStartTime += drop / SAMPLE_RATE; }
  if (selfTestActive) handleSelfTest();
  else if (state === 'awaiting') handleAwait();
}

function playChirp(chirpReal, when){
  const b = audioCtx.createBuffer(1, chirpReal.length, SAMPLE_RATE);
  b.getChannelData(0).set(chirpReal);
  const src = audioCtx.createBufferSource(); src.buffer = b;
  const g = audioCtx.createGain(); g.gain.value = 1.0;
  src.connect(g); g.connect(audioCtx.destination);
  src.start(when);
}

// 在缓冲区内检测 chirp，返回其到达的音频时钟时间（秒），找不到返回 null
function detectChirp(ref, chirpLen){
  if (buf.length < chirpLen) return null;
  const win = new Float32Array(N_FFT);
  const start = Math.max(0, buf.length - N_FFT);
  const len = buf.length - start;
  win.set(buf.subarray(start), 0);
  const winStartTime = bufStartTime + start / SAMPLE_RATE;
  const env = matchedFilterEnv(win, ref.re, ref.im);
  const peak = findPeak(env, chirpLen);
  if (!peak) return null;
  // 归一化相关：真实 chirp ≈0.707（与音量无关），人声/宽带噪声远小于 0.35
  const p = Math.round(peak.pos);
  let sigE = 0;
  for (let k = 0; k < chirpLen; k++){
    const s = (p + k < N_FFT) ? win[p + k] : 0;
    sigE += s * s;
  }
  const corrNorm = sigE > 0 ? peak.value / Math.sqrt(sigE * refEnergy) : 0;
  if (corrNorm < 0.35) return null;
  return winStartTime + peak.pos / SAMPLE_RATE;
}

// ===== 测距端流程 =====
function measure(isCalib){
  if (!connected || state === 'awaiting') return;
  results = [];
  pendingCalib = isCalib;
  measureBtn.disabled = true;
  calBtn.disabled = true;
  doOneMeasure();
}

function doOneMeasure(){
  buf = new Float32Array(0); bufStartTime = 0;
  t0 = audioCtx.currentTime + 0.02;
  playChirp(upChirp.re, t0);
  deafUntil = t0 + 0.12;   // 忽略 30ms chirp + 回声余量
  state = 'awaiting';
  deadline = t0 + 2.0;
  distLine.textContent = (pendingCalib ? '校准中' : '测量中') + ' ' + (results.length + 1) + '/' + TARGET_COUNT + '…';
}

function handleAwait(){
  const t3 = detectChirp(downRef, downChirp.length);
  if (t3 !== null){
    const rtt = t3 - t0;
    state = 'idle';
    results.push(rtt);
    if (results.length < TARGET_COUNT){
      setTimeout(doOneMeasure, 300);   // 间隔 300ms，等回声衰减
    } else {
      finish();
    }
  } else if (audioCtx.currentTime > deadline){
    state = 'idle';
    measureBtn.disabled = false;
    calBtn.disabled = false;
    setDist('---', 'm');
    distLine.textContent = '第 ' + (results.length + 1) + ' 次超时（未收到应答）';
  }
}

function finish(){
  measureBtn.disabled = false;
  calBtn.disabled = false;
  if (results.length === 0){ setDist('---', 'm'); distLine.textContent = '测量失败'; return; }
  const sorted = results.slice().sort((a, b) => a - b);
  const rtt = sorted[Math.floor(sorted.length / 2)];   // 中位数
  const isCalib = pendingCalib;
  pendingCalib = false;
  if (isCalib){
    calibRTT = rtt;
    calState.textContent = '已校准';
    calState.className = 'ok';
    setDist('0.00', 'm');
    distLine.textContent = '校准完成（往返 ' + (rtt * 1000).toFixed(1) + ' ms）';
  } else {
    const c = parseFloat(soundSpeed.value) || 343;
    const d = calibRTT !== null ? (rtt - calibRTT) / 2 * c : rtt / 2 * c;
    if (d < 0.01){ setDist('0.00', 'm'); }
    else if (d < 1){ setDist((d * 100).toFixed(0), 'cm'); }
    else { setDist(d.toFixed(2), 'm'); }
    distLine.textContent = (calibRTT === null ? '未校准（数值含固定偏移）' : '往返 ' + (rtt * 1000).toFixed(1) + ' ms · ' + results.length + ' 次中位数');
  }
}

// ===== 自测（本机回环，验证能否收发当前频段）=====
let selfTestActive = false, selfTestDeadline = 0;

function selfTest(){
  if (!connected || state === 'awaiting') return;
  buf = new Float32Array(0); bufStartTime = 0;
  const t = audioCtx.currentTime + 0.02;
  playChirp(upChirp.re, t);
  selfTestActive = true;
  selfTestDeadline = t + 1.5;
  distLine.textContent = '自测中：播放 chirp 并回听…';
}

function handleSelfTest(){
  const t1 = detectChirp(upRef, upChirp.length);
  if (t1 !== null){
    selfTestActive = false;
    distLine.textContent = '自测通过 ✓ 本机能收发 ' + (CHIRP_F0/1000) + '~' + (CHIRP_F1/1000) + ' kHz';
  } else if (audioCtx.currentTime > selfTestDeadline){
    selfTestActive = false;
    distLine.textContent = '自测失败 ✗ 本机无法收发该频段（扬声器或麦克风不支持），换频段再试';
  }
}

// ===== UI =====
const connDot = document.getElementById('connDot');
const connBtn = document.getElementById('connBtn');
const dist = document.getElementById('dist');
const distVal = document.getElementById('distVal');
const unitEl = dist.querySelector('.unit');
const distLine = document.getElementById('distLine');
const measureBtn = document.getElementById('measureBtn');
const calBtn = document.getElementById('calBtn');
const calState = document.getElementById('calState');
const soundSpeed = document.getElementById('soundSpeed');
const selfTestBtn = document.getElementById('selfTestBtn');

function setDist(text, unit){
  distVal.textContent = text;
  unitEl.textContent = unit || 'm';
}

connBtn.addEventListener('click', () => {
  connect().catch(e => { distLine.textContent = '连接失败：' + e.message + '（需 HTTPS/localhost）'; });
});
measureBtn.addEventListener('click', () => measure(false));
calBtn.addEventListener('click', () => measure(true));
selfTestBtn.addEventListener('click', () => selfTest());
</script>
</body>
</html>
